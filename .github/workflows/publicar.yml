# Revisa los tipos, corre las pruebas, compila y publica la app en GitHub Pages
# (rama gh-pages). La dirección queda en https://renzomoran9.github.io/Lectura/
name: Publicar en GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Las voces propias (145 MB) no están en el repositorio: se bajan al publicar y se guardan
      # en la caché de Actions para no bajarlas cada vez.
      - name: Caché de las voces
        uses: actions/cache@v4
        with:
          path: public/voces/supertonic
          key: voces-${{ hashFiles('scripts/voces.mjs') }}

      - name: Bajar las voces
        run: npm run voces

      - name: Revisar tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'Publicar ${{ github.sha }}'
